<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GingaHelp</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand-mark">G<span>+</span></div>
      <div><p class="eyebrow">HOUSEHOLD ASSISTANCE SYSTEM</p><h1>GINGA<span>HELP</span></h1></div>
    </header>
    <section class="request-grid" aria-label="Available requests">
      <div class="request-tile tea"><i class="fa-solid fa-mug-hot" aria-hidden="true"></i><h2>Tea</h2><p>Request a cuppa</p></div>
      <div class="request-tile noms"><i class="fa-solid fa-cookie-bite" aria-hidden="true"></i><h2>Noms</h2><p>Request your crackers</p></div>
      <div class="request-tile help"><i class="fa-solid fa-hand-holding-heart" aria-hidden="true"></i><h2>Help</h2><p>Come and help me</p></div>
      <div class="request-tile dog"><i class="fa-solid fa-paw" aria-hidden="true"></i><h2>Dog</h2><p>Dog-related requests</p></div>
      <div class="request-tile hugs"><i class="fa-solid fa-heart" aria-hidden="true"></i><h2>Hugs</h2><p>Come and give me a hug</p></div>
      <div class="request-tile notify"><i class="fa-solid fa-bell" aria-hidden="true"></i><h2>Notify</h2><p>Thinking of you</p></div>
      <div class="request-tile scratch"><i class="fa-solid fa-hands" aria-hidden="true"></i><h2>Scratch + Shoulders</h2><p>A massage and a scratch</p></div>
      <div class="request-tile nits"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><h2>Nit Nits</h2><p>Pick my spots</p></div>
    </section>
    <footer>GINGAHELP <span>•</span> EST. 2026</footer>
  </main>
</body>
</html>
