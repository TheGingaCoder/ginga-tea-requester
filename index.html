<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <meta name="description" content="GingaHelp household assistance app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GingaHelp</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./status.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand-mark">G<span>+</span></div>
      <div class="brand-copy"><p class="eyebrow">HOUSEHOLD ASSISTANCE SYSTEM</p><h1>GINGA<span>HELP</span></h1></div>
      <a class="control-link" href="./control/" aria-label="Open GingaHelp control panel"><i class="fa-solid fa-sliders"></i><span>CONTROL</span></a>
    </header>
    <section class="request-grid" aria-label="Available requests">
      <button class="request-tile tea" type="button" data-request="tea" disabled><i class="fa-solid fa-mug-hot" aria-hidden="true"></i><h2>Tea</h2><p>Request a cuppa</p></button>
      <button class="request-tile noms" type="button" data-request="noms" disabled><i class="fa-solid fa-cookie-bite" aria-hidden="true"></i><h2>Noms</h2><p>Request your crackers</p></button>
      <button class="request-tile help" type="button" data-request="help" disabled><i class="fa-solid fa-hand-holding-heart" aria-hidden="true"></i><h2>Help</h2><p>Come and help me</p></button>
      <button class="request-tile dog" type="button" data-request="dog" disabled><i class="fa-solid fa-paw" aria-hidden="true"></i><h2>Dog</h2><p>Dog-related requests</p></button>
      <button class="request-tile hugs" type="button" data-request="hugs" disabled><i class="fa-solid fa-heart" aria-hidden="true"></i><h2>Hugs</h2><p>Come and give me a hug</p></button>
      <button class="request-tile notify" type="button" data-request="notify" disabled><i class="fa-solid fa-bell" aria-hidden="true"></i><h2>Notify</h2><p>Thinking of you</p></button>
      <button class="request-tile scratch" type="button" data-request="scratch" disabled><i class="fa-solid fa-hands" aria-hidden="true"></i><h2>Scratch + Shoulders</h2><p>A massage and a scratch</p></button>
      <button class="request-tile nits" type="button" data-request="nits" disabled><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><h2>Nit Nits</h2><p>Ask Luke to pick his spots</p></button>
    </section>
    <footer>GINGAHELP <span>•</span> EST. 2026</footer>
    <div class="modal-backdrop" id="request-modal" hidden>
      <section class="request-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description">
        <button class="modal-close" id="modal-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-icon" id="modal-icon"><i class="fa-solid fa-mug-hot"></i></div>
        <p class="eyebrow">NEW REQUEST</p>
        <h2 id="modal-title">Tea</h2>
        <p id="modal-description">Request a cuppa.</p>
        <div id="modal-options" class="modal-options" hidden>
          <label for="dog-choice">What do you need?</label>
          <select id="dog-choice">
            <option value="Give water">Give water</option>
            <option value="Give food">Give food</option>
            <option value="Let outside">Let outside</option>
            <option value="Bring from outside">Bring from outside</option>
          </select>
        </div>
        <div class="modal-actions"><button class="modal-secondary" id="modal-cancel" type="button">Cancel</button><button class="modal-confirm" id="modal-confirm" type="button">Send request</button></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <section class="status-screen" id="status-screen" hidden>
    <div class="hazard-stripe" aria-hidden="true"></div>
    <div class="inactive-message">
      <p class="status-kicker">GINGAHELP STATUS</p>
      <h2 id="status-title">SYSTEM INACTIVE</h2>
      <p id="status-message">The Ginger Is Not Home</p>
    </div>
    <div class="hazard-stripe" aria-hidden="true"></div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
